name: Reminder digests

# Free daily cron — calls the Render API (no paid Render Cron Job needed).
on:
  schedule:
    # 18:30 UTC = 00:00 IST (midnight India)
    - cron: "30 18 * * *"
  workflow_dispatch: # allow manual "Run workflow" from the Actions tab

jobs:
  send:
    name: Trigger reminder digests
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/reminder-digests
        env:
          API_URL: ${{ secrets.REMINDER_API_URL }}
          CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing REMINDER_API_URL or REMINDER_CRON_SECRET repo secret"
            exit 1
          fi
          # Capture body even on non-2xx so Render errors show in the Action log
          http_code=$(curl -sS -o /tmp/digest-body.txt -w "%{http_code}" \
            -X POST "${API_URL%/}/internal/reminder-digests" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP ${http_code}"
          cat /tmp/digest-body.txt
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
