name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Shared TEST_DATABASE_URL — only one suite at a time or fixtures collide.
concurrency:
  group: backend-ci-test-db
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
      ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dependency audit
        # Advisory visibility only — does not fail the build on known CVEs.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Apply database migrations
        # TEST_DATABASE_URL is shared remote Supabase — pooler can briefly refuse
        # connections (EAUTHQUERY / ECIRCUITBREAKER). Retry before failing CI.
        run: |
          for attempt in 1 2 3 4 5; do
            if alembic upgrade head; then
              exit 0
            fi
            echo "alembic upgrade head failed (attempt ${attempt}/5); waiting before retry..."
            sleep $((attempt * 15))
          done
          echo "alembic upgrade head failed after 5 attempts"
          exit 1

      - name: Run tests
        run: pytest tests/ -v --tb=short
